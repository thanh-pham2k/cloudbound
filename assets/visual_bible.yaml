game: Cloudbound
title: "Đường Đến Thiên Giới (Cloudbound: Path to Heaven)"
bible_version: 2
source_doc: "docs/assets/VISUAL_BIBLE.md"

# 1. Art Style & Gameplay-First Direction
art_style:
  label: "Minimal Hand-Painted Isometric"
  style: minimal_hand_painted_isometric
  priority: gameplay_first  # Low detail, strong silhouette, readable at gameplay zoom before polish
  detail_level: low
  outline: crisp_dark_ink
  outline_color: "#1E293B"
  outline_weight: consistent_1_2px
  shading: soft_cel
  texture: minimal

# 2. Perspective & Fixed Camera (Global 2.5D Isometric Standard)
camera:
  perspective: isometric_2_5d
  projection: fixed_isometric_2_1  # 2:1 isometric dimetric tile ratio (e.g. 128x64, 256x128)
  angle_deg: 30
  axis_rotation_deg: 45
  volume_cues: top_and_two_front_isometric_faces
  forbidden_views:
    - flat_2d_side_view
    - pure_90deg_top_down
  y_sorting: true
  godot_texture_filter: nearest

# 3. Lighting & Shadows
lighting:
  direction: top_left_45deg
  ambient: warm_daylight
  ground_shadow:
    enabled: true
    color: "#1E293B"
    opacity: 0.25
    style: soft_ellipse_contact

# 4. Color Palette
colors:
  primary_environment:
    - name: Soft Jade Green
      hex: "#6BBF9B"
    - name: Deep Jade Moss
      hex: "#4E9A7A"
  highlight_stone:
    - name: Warm Cream
      hex: "#F5EFE0"
    - name: Carved Stone
      hex: "#E4D8BE"
  sky_atmosphere:
    - name: Sky Blue
      hex: "#7CC6EE"
    - name: Deep Sky
      hex: "#4E8EC4"
  accent_threat:
    - name: Muted Crimson
      hex: "#C95B5B"
    - name: Deep Crimson
      hex: "#8F3439"
  celestial_accent:
    - name: Warm Gold
      hex: "#E8BE54"
    - name: Deep Gold
      hex: "#C4932B"
  ink_shadow:
    - name: Deep Indigo-Slate
      hex: "#1E293B"

# 5. Object Scale (relative to Hero = 1.0x)
object_scale:
  base_tile_px: [128, 64]
  hero_height_ratio: 1.0
  small_prop_ratio: 0.4-0.7
  medium_prop_ratio: 0.8-1.2
  large_prop_tree_ratio: 1.8-2.5
  boss_ratio: 2.5-3.0

# 6. Global Asset Rules (inherited by Category & Asset Override)
assets:
  format: png
  color_mode: RGBA
  background: transparent
  naming: snake_case
  safe_margin_px: 4
  anchor_default: bottom_center
  collision_default: base_footprint
  reference_required: true
  immutable_after_approval: true

# 7. Reference Library
references:
  map_concept: "assets/references/map_concept.jpg"
  environment: "assets/references/environment.png"
  characters: "assets/references/characters.png"
  props: "assets/references/props.png"

# 8. Metadata Inheritance Hierarchy
inheritance:
  order:
    - global: "assets/visual_bible.yaml"
    - category: "assets/<category>/config.yaml"
    - asset_override: "assets/<category>/<asset_id>/prompt.md (optional YAML frontmatter)"

# 9. QA Validation Criteria
qa_criteria:
  consistency:
    - matches_palette_and_outline
    - matches_isometric_2_5d_perspective
    - matches_group_reference_scale
  gameplay_readability:
    - clear_silhouette_at_gameplay_zoom
    - low_visual_noise_no_clutter
    - clear_walkable_vs_blocked_separation
  engine_integration:
    - valid_rgba_transparent_png
    - dimensions_in_valid_set
    - bottom_anchor_aligned_for_y_sort
    - atlas_json_and_tres_valid
