category: characters
inherits: "assets/visual_bible.yaml"
reference: "assets/references/characters.png"
profile_ref: "profiles/cloudbound_isometric.json"

# Category defaults; animation frame counts/FPS/directions come from profile_ref
dimensions:
  frame_width: 128
  frame_height: 128
  proportions: chibi_1_to_2_5

anchor:
  mode: bottom_center_feet
  x: 64
  y: 112

collision:
  mode: feet_circle
  radius_px: 18

animation:
  source: "profiles/cloudbound_isometric.json"
  directions: ["down", "right", "up"]
  allow_horizontal_flip: true
