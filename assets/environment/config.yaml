category: environment
inherits: "assets/visual_bible.yaml"
reference: "assets/references/environment.png"

# Category defaults (override Global only where category-specific)
dimensions:
  tile_base: [128, 64]
  valid_sizes:
    - [128, 64]
    - [128, 128]
    - [256, 128]
    - [256, 256]

anchor:
  mode: bottom_center
  tile_mode: top_diamond_center

collision:
  terrain_tile: walkable_surface
  blocker_prop: base_only  # e.g. tree trunk / rock base, canopy stays pass-through

animation:
  default_states: ["idle"]
  optional_states: ["shaking"]

seamless_required_for:
  - terrain_tile
  - grass_patch
  - stone_path
